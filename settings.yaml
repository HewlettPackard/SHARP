cli:
  default_backend: local  # Backend used when -b/--backend not specified
  default_repeater: count  # Repeater used when -r/--repeater not specified
  verbose: false  # Enable verbose output by default

comparisons:
  # Thresholds for system metadata comparison warnings
  cpu_freq_threshold_pct: 5  # % CPU frequency difference to flag warning
  load_avg_threshold_factor: 0.1  # Factor of load average to flag warning
  memory_threshold_pct: 1  # % memory difference to flag warning

data:
  backends_dir: backends  # Directory containing backend configuration files
  benchmarks_dir: benchmarks  # Directory containing benchmark definitions
  output_precision: 5  # Decimal places for numeric output in CSV/reports
  runlogs_dir: runlogs  # Directory where experiment results are stored

gui:
  # Server configuration
  host: 0.0.0.0  # GUI server bind address (0.0.0.0 = all interfaces)
  port: 8282  # GUI server port
  theme: cosmo  # Shiny theme name (cosmo, flatly, darkly, spacelab, etc.)

  # Distribution plot visualization settings
  distribution:
    alpha: 0.4  # Transparency for distribution plot fill
    divider_color: '#1f77b4'  # Color for distribution divider line
    fast_color: '#a1e736'  # Color for fast/better performance region
    slow_color: '#dd560e'  # Color for slow/worse performance region
    fast_label: FAST  # Label for better performance class
    slow_label: SLOW  # Label for worse performance class
    palette: bright # Color palette for non-binary labelers (tab10, deep, muted, pastel, bright, dark, colorblind, viridis)

  # Explore tab settings
  explore:
    max_scatter_points: 2000  # Maximum scatter plot points (performance limit)

  # Overview tab settings
  overview:
    recent_runs_count: 25  # Number of recent runs to display in overview tab

profiling:
  # Profiling workflow configuration
  prof_suffix: -prof  # Suffix appended to profiling run task names (e.g., task-prof)
  max_correlation: 0.99  # Maximum correlation threshold for predictor inclusion
  max_predictors: 200  # Maximum number of predictors to consider in analysis (increased from 100 due to 10-16x speedup in selection)
  max_search: 100  # Maximum iterations for optimal cutoff search algorithm

  # Required metadata fields for profiling reproduction (--repro flag)
  required_md_fields:
  - benchmark_spec    # Benchmark specification from markdown metadata
  - backend_options    # Backend configuration from markdown metadata

  # Predictor selection optimization parameters
  predictor_selection:
    max_categorical_unique: 100  # Maximum unique values for a column to be treated as categorical
    min_eta: 0.01  # Minimum eta-squared (effect size) for categorical predictors
    max_per_group: 3  # Maximum representatives to select per metric group
    chunk_size: 5000  # Chunk size for vectorized correlation computation

  # Data model detection: source columns for tall vs wide format
  source_column_names: [host, hostname, node, rank, device, nic, thread, pid]

  # Data reduction: column and row filtering strategies (Phase 1.1)
  data_reduction:
    enabled: true                          # Master switch for all row/column reduction

    # Small-data bypass thresholds
    max_columns_without_reduction: 500      # Skip column reduction if data has fewer columns
    max_rows_without_reduction: 50000       # Skip row reduction if data has fewer rows

    # C1: Column completeness gate parameters
    c1_min_absolute_non_null: 30            # Minimum non-null values required in a column
    c1_max_null_percentile: 0.05            # Drop columns in bottom N% by null fraction
    c1_preserve_outcome_aligned_sparse: true  # Preserve sparse columns that appear with outcome

    # C2: Near-zero variance filter
    c2_max_constant_fraction: 0.95          # Drop columns where mode fraction >= this

    # C3: Outcome-relevance gate
    c3_min_abs_correlation: 0.05            # Drop columns with |r| < this with outcome

    # C4: Mutual information screening (optional, for non-standard naming)
    c4_use_mutual_information: false        # Use MI screening instead of semantic grouping
    c4_n_select: 300                        # Number of top columns to select by MI

    # R2: Warmup/cooldown exclusion
    r2_exclude_warmup: false                # Exclude warmup/cooldown rows (optional)
    r2_warmup_fraction: null                # Fraction of rows to drop at start (if not null, use this)
    r2_use_changepoints: false              # Auto-detect warmup via changepoint detection

  # Decision tree training parameters
  tree_training:
    completeness_threshold: 0.95  # Minimum data completeness ratio for tree training
    target_rows: 5000  # Target number of rows for balanced training dataset (increased from 1000 due to predictor selection and class-aware downsampling speedups)

    # Class-aware downsampling parameters for efficient training
    min_class_size: 300  # Classes with fewer samples than this are never downsampled (preserve rare cases)
    cv_threshold: 0.15  # Coefficient of variation threshold: classes below this are "concentrated" and safe to downsample
    base_sample_ratio: 0.20  # For concentrated classes, keep this fraction of samples (20% → 5x reduction)
